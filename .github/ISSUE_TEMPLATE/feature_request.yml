name: Feature request
description: Suggest an idea or improvement for h6s.
body:
  - type: markdown
    attributes:
      value: |
        We encourage you to use AI to assist you in researching and reviewing feature requests. However, you must review and deeply understand the feature you are proposing. For this reason, **issue descriptions from external contributors must be written and created by a human**.

        Before opening an issue, please [search the existing ones](https://github.com/toss/h6s/issues). If you find the same request, upvote it instead of opening a new one.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Select the package or area that would benefit from this feature.
      options:
        - '@h6s/calendar'
        - '@h6s/table'
        - Repository-wide
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Share any alternatives, examples, prior art, or other relevant context.
    validations:
      required: false
  - type: checkboxes
    id: validations
    attributes:
      label: Validations
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read the [Contributing Guidelines](https://github.com/toss/h6s/blob/main/CONTRIBUTING.md).
          required: true
        - label: I wrote this description myself.
          required: true

name: Bug report
description: Report behavior that does not match the documentation.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        We encourage you to use AI to assist you in researching and reviewing bug reports. However, you must review and deeply understand the issues you are reporting. For this reason, **issue descriptions from external contributors must be written and created by a human**. You can use AI to help create a reproduction.

        Proposing a new feature? Open a [feature request](https://github.com/toss/h6s/issues/new?template=feature_request.yml) instead.

        Before opening an issue, please [search the existing ones](https://github.com/toss/h6s/issues). If you find the same report, upvote it instead of opening a new one.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Select the package where the problem occurs.
      options:
        - '@h6s/calendar'
        - '@h6s/table'
        - Repository-wide
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Enter the installed version of the selected package, or N/A for a repository-wide issue.
      placeholder: 2.2.0 or N/A
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        The smallest piece of code that reproduces the issue. A link to StackBlitz or a public repository works too.

        **Skipping this or providing a reproduction we cannot run will result in the issue being closed.**
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Current vs. expected behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: checkboxes
    id: validations
    attributes:
      label: Validations
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read the [Contributing Guidelines](https://github.com/toss/h6s/blob/main/CONTRIBUTING.md).
          required: true
        - label: I wrote this description myself.
          required: true
